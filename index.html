<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人展示页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin: 10px 0;
            opacity: 0.9;
        }
        .links {
            margin-top: 30px;
        }
        a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            transition: all 0.3s;
        }
        a:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>你好，我是YY老大</h1>
        <p>👋 欢迎来到我的个人展示页</p>
        <p>💼 职业/身份：XX行业从业者 / 学生 / 自由职业者</p>
        <p>📧 联系方式：你的邮箱 / 微信</p>
        <div class="links">
            <a href="https://github.com/你的用户名">GitHub</a>
            <a href="#">其他链接（比如作品集、博客）</a>
        </div>
    </div>
</body>
</html>
